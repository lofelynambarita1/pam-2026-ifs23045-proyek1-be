version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: hairlogy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       db_hairlogy
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data.sql:/docker-entrypoint-initdb.d/data.sql

  app:
    build: .
    container_name: hairlogy-be
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     db_hairlogy
      DB_USER:     postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
